<mat-drawer-container class="container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-list>
      <mat-list-item><a routerLink="/" matButton>Home</a></mat-list-item>
      <mat-list-item><a routerLink="/orders" matButton>Orders</a></mat-list-item>
      <mat-list-item
        ><a routerLink="/contacts" matButton *appIsInRoles="[roles.Read, roles.Update, roles.Admin]"
          >Contacts</a
        ></mat-list-item
      >
      <mat-list-item><a routerLink="/auth" matButton>Authentication</a></mat-list-item>
    </mat-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-drawer-container>
