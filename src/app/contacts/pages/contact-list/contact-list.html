<h1>Contacts</h1>

<a routerLink="/contacts/add" matButton>Add new</a>

<table mat-table [dataSource]="dataSource" matSort>
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>
  <ng-container matColumnDef="firstname">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
    <td mat-cell *matCellDef="let element">{{ element.firstname }}</td>
  </ng-container>
  <ng-container matColumnDef="lastname">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
    <td mat-cell *matCellDef="let element">{{ element.lastname }}</td>
  </ng-container>
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
    <td mat-cell *matCellDef="let element">{{ element.email }}</td>
  </ng-container>
  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
    <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
  </ng-container>
  <ng-container matColumnDef="street">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Street</th>
    <td mat-cell *matCellDef="let element">{{ element.street }}</td>
  </ng-container>
  <ng-container matColumnDef="placeName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Place</th>
    <td mat-cell *matCellDef="let element">{{ element.placeName }}</td>
  </ng-container>
  <ng-container matColumnDef="postCode">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Post Code</th>
    <td mat-cell *matCellDef="let element">{{ element.postCode }}</td>
  </ng-container>
  <ng-container matColumnDef="canton">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Canton</th>
    <td mat-cell *matCellDef="let element">{{ element.canton }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th *matHeaderCellDef class="w-75 th-center" mat-header-cell>Actions</th>
    <td *matCellDef="let element" mat-cell>
      <button
        *appIsInRoles="[roles.Update]"
        (click)="edit(element.id)"
        color="primary"
        mat-icon-button
      >
        <mat-icon fontIcon="edit"></mat-icon>
      </button>
      <button (click)="delete(element)" color="warn" mat-icon-button>
        <mat-icon fontIcon="delete_forever"></mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
