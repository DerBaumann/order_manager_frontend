<h2 mat-dialog-title>Delete Contact?</h2>
<mat-dialog-content>
  <p>Do you want to delete the contact {{ data.contact.firstname }} {{ data.contact.lastname }}?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">Cancel</button>
  <button matButton [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
