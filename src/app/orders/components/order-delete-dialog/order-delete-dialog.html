<h2 mat-dialog-title>Delete Order?</h2>
<mat-dialog-content>
  <p>Do you want to delete the order {{ data.order.name }}?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">Cancel</button>
  <button matButton [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
