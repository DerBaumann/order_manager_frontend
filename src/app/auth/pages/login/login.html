<form class="login-form">
  <mat-form-field>
    <label for="username">Username</label>
    <input id="username" type="text" matNativeControl [formControl]="username" />
  </mat-form-field>
  <mat-form-field>
    <label for="password">Password</label>
    <input id="password" type="password" matNativeControl [formControl]="password" />
  </mat-form-field>
</form>
